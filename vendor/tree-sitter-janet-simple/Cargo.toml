[package]
name = "tree-sitter-janet-simple"
version = "0.1.0"
description = "Janet grammar for tree-sitter, vendored from sogaiu/tree-sitter-janet-simple"
license = "CC0-1.0"
edition = "2021"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tree-sitter = "0.27"
