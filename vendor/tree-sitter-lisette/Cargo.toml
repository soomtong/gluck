[package]
name = "tree-sitter-lisette"
version = "0.1.0"
description = "Lisette grammar for tree-sitter, vendored from ivov/lisette (editors/tree-sitter-lisette)"
license = "MIT"
edition = "2021"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tree-sitter = "0.23"
