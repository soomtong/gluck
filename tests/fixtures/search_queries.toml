# gluck 자체 검색 회귀 추적용 fixture.
# 정답은 path 위주. Symbol 정답을 명시할 때만 kind/title을 추가.
# category는 쿼리의 의도/형태를 분류한다 (exact_identifier, natural_language,
# korean, typo, paraphrase, commit, negative). negative 쿼리는 expected 대신
# forbidden 으로 "이 결과가 상위 10에 들어오면 실패"를 표현한다.

